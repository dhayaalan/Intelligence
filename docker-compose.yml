# ==============================================================================
# Sential Intelligence Platform - Docker Compose Configuration
# 
# Core stack (started with `docker compose up -d`):
#   - mongodb:    Primary persistent database (Motor / PyMongo)
#   - backend:    FastAPI application (Python 3.10 non-root, port 8000)
#   - frontend:   Nginx production server + SPA fallback + reverse proxy (port 3000)
#
# Optional supporting services (started with `docker compose --profile supporting up -d`):
#   - redis:      Message broker & cache placeholder
#   - minio:      S3-compatible object storage placeholder
#
# Scanner profile (started with `docker compose --profile scanners up -d`):
#   - zap:        OWASP ZAP dynamic application scanner container
# ==============================================================================

networks:
  intelligence-network:
    driver: bridge
    name: intelligence-network

volumes:
  mongodb_data:
    name: intelligence_mongodb_data
  neo4j_data:
    name: intelligence_neo4j_data
  redis_data:
    name: intelligence_redis_data
  minio_data:
    name: intelligence_minio_data

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB - Primary Data Store
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: intelligence-mongodb
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      # Bound to localhost 27018 to prevent collision with local host mongod on 27017
      - "127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Neo4j - Dedicated Relationship Graph Database
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20.0-community
    container_name: intelligence-neo4j
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/sential_neo4j_secret}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1024m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 3. Backend - FastAPI Core Intelligence Platform
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelligence-backend
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=Sential Intelligence Platform
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-sential_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-sential_neo4j_secret}
      - SECRET_KEY=${SECRET_KEY}
      - INITIAL_SUPER_ADMIN_EMAIL=${INITIAL_SUPER_ADMIN_EMAIL:-superadmin@sential.io}
      - INITIAL_SUPER_ADMIN_PASSWORD=${INITIAL_SUPER_ADMIN_PASSWORD:-}
      - SEARCH_JOB_TIMEOUT_SECONDS=${SEARCH_JOB_TIMEOUT_SECONDS:-60}
      - PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT_SECONDS:-10}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - ZAP_API_URL=${ZAP_API_URL:-http://172.17.0.1:8090}
      - ZAP_API_KEY=${ZAP_API_KEY:-changeme}
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Frontend - React / Vite SPA served via Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelligence-frontend
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Optional Supporting Services (Profile: supporting)
  # ----------------------------------------------------------------------------
  redis:
    profiles: ["supporting"]
    image: redis:7-alpine
    container_name: intelligence-redis
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    profiles: ["supporting"]
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: intelligence-minio
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 5. Optional Security Scanners (Profile: scanners)
  # ----------------------------------------------------------------------------
  zap:
    profiles: ["scanners"]
    image: zaproxy/zap-stable:latest
    container_name: intelligence-zap
    restart: unless-stopped
    networks:
      - intelligence-network
    ports:
      - "127.0.0.1:${ZAP_PORT:-8091}:8090"
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
