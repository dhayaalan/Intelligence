name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-validation:
    name: Backend Syntax & Tool Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python syntax and bytecode compilation
        run: python -m compileall -q backend/app backend/tests scripts

      - name: Verify OSINT and Threat Intelligence provider registries
        run: python scripts/verify_tools.py

  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        working-directory: backend
        run: python -m pytest

  frontend-typecheck:
    name: Frontend TypeScript Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

  pr-hygiene:
    name: PR Hygiene & Guardrails
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR Title Conventional Commit Format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR title: $PR_TITLE"
          CONVENTIONAL_PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\-\/]+\))?: .+"
          if [[ ! "$PR_TITLE" =~ $CONVENTIONAL_PATTERN ]]; then
            echo "::error::PR title '$PR_TITLE' does not match conventional commits pattern!"
            echo "Expected format: type(scope): description (e.g., 'feat(auth): add MFA support' or 'ci: add workflows')"
            exit 1
          fi
          echo "PR title conforms to conventional commits."

      - name: Check for prohibited committed files
        run: |
          PROHIBITED_FILES=$(git ls-files | grep -E '(\.env(\..+)?$|credentials\.json|\.pem$|\.key$|\.id_rsa$)' | grep -v '\.env\.example' || true)
          if [ -n "$PROHIBITED_FILES" ]; then
            echo "::error::Prohibited sensitive files detected in repository tracking:"
            echo "$PROHIBITED_FILES"
            exit 1
          fi
          echo "No prohibited sensitive files detected in repository tracking."
